BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "petasos"
BBFILE_PATTERN_petasos := "^${LAYERDIR}/"
BBFILE_PRIORITY_petasos = "30"

LAYERVERSION_petasos = "1"
LAYERSERIES_COMPAT_petasos = "wrynose"
LAYERDEPENDS_petasos = "core superbird meson chromium-browser-layer networking-layer multimedia-layer"

# The device program is built outside Yocto (client/build.sh) and committed; the recipe takes it from here.
PETASOS_CLIENT_DIST := "${LAYERDIR}/../../client/dist"

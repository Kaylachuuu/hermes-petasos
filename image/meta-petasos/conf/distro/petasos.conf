require conf/distro/superbird.conf

DISTRO = "petasos"
DISTRO_NAME = "Petasos"
DISTRO_VERSION = "0.4.0"

SUPERBIRD_HOSTNAME = "petasos"
SUPERBIRD_MDNS_SERVICE_NAME = "Petasos"
SUPERBIRD_USB_GADGET_NAME = "petasos"
SUPERBIRD_USB_GADGET_MANUFACTURER = "Kaylachuuu"
SUPERBIRD_USB_GADGET_PRODUCT = "Petasos"

# The screen: a local page for now; the petasos program will serve a live one later.
CHROMIUM_KIOSK_URL = "file:///usr/share/petasos-screen/index.html"

# Boot logo and splash: both the winged hat (image/splash/), so one picture shows until the screen. The bbappends under recipes-bsp and
# recipes-graphics put these files on FILESEXTRAPATHS.
SUPERBIRD_BOOT_LOGO_NAME = "petasos-bootup.bmp"
SUPERBIRD_WESTON_SPLASH_IMAGE = "petasos-splash.png"

# ffmpeg decodes an iPod's music (AAC as well as MP3) on the Car Thing. Its recipe is flagged
# "commercial" for the patented codecs it can build; this accepts that for ffmpeg alone.
LICENSE_FLAGS_ACCEPTED:append = " commercial_ffmpeg"

# Built in, not modules: the image leaves kernel modules out.

# Bluetooth tethering to the phone (BlueZ Network1 "nap" -> bnep0)
CONFIG_BT_BNEP=y
CONFIG_BT_BNEP_MC_FILTER=y
CONFIG_BT_BNEP_PROTO_FILTER=y

# WireGuard home, independent of the phone's own VPN
CONFIG_NET_UDP_TUNNEL=y
CONFIG_WIREGUARD=y

# For a userspace tunnel if ever needed
CONFIG_TUN=y

# A phone sharing its internet over USB, with the port switched to host (superbird-usb-role,
# set on the Network tab): iPhones (ipheth), Android (RNDIS, or NCM on newer phones), and plain
# USB Ethernet (CDC ECM). The BSP builds these as modules, which the image leaves out.
CONFIG_USB_USBNET=y
CONFIG_USB_NET_DRIVERS=y
CONFIG_USB_NET_CDCETHER=y
CONFIG_USB_NET_CDC_NCM=y
CONFIG_USB_NET_RNDIS_HOST=y
CONFIG_USB_IPHETH=y

# An iPod (or a USB drive) plugged in with the port switched to host, for its music (petasos's
# ipod_linux.go mounts it read-only): USB mass storage, the partition maps an iPod has (a Mac's,
# or a PC's), and the disk formats: FAT32 from Windows, HFS+ from a Mac, exFAT on a drive.
CONFIG_SCSI=y
CONFIG_BLK_DEV_SD=y
CONFIG_USB_STORAGE=y
CONFIG_PARTITION_ADVANCED=y
CONFIG_MAC_PARTITION=y
CONFIG_MSDOS_PARTITION=y
CONFIG_EFI_PARTITION=y
CONFIG_FAT_FS=y
CONFIG_VFAT_FS=y
CONFIG_FAT_DEFAULT_UTF8=y
CONFIG_HFSPLUS_FS=y
CONFIG_EXFAT_FS=y
CONFIG_NLS=y
CONFIG_NLS_CODEPAGE_437=y
CONFIG_NLS_ISO8859_1=y
CONFIG_NLS_UTF8=y

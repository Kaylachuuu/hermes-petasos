    <stop offset="0" stop-color="#2a241e"/>
    <stop offset="1" stop-color="#17140f"/>
  </linearGradient>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
    <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".35"/>
  </filter>
</defs>
<rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)" filter="url(#shadow)"/>
<rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#c9b48a" stroke-opacity=".18" stroke-width="3"/>

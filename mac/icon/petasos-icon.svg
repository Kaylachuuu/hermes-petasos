<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<!-- The Mac app's icon: the winged hat from the boot logo (image/splash/petasos-bootlogo.svg)
     on a macOS-sized tile (824 of 1024, leaving the usual margin for the shadow). -->
<defs>

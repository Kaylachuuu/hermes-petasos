<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in to Hermes</title>
<style>
/* The app's sign-in (Mac and Windows alike), shared with settings.html. */
@font-face { font-family: "Caladea"; src: url(fonts/caladea.woff2) format("woff2"); font-weight: 400; }
@font-face { font-family: "Source Sans 3"; src: url(fonts/source-sans-3.woff2) format("woff2"); font-weight: 400 600; }
:root {
  --night: #1f1b17; --bronze: #c9b48a; --dust: #9c8a68; --ember: #d97a3a; --alarm: #d9543a;
  --rule: #3a2f25; --row: #2a1f16;
  --display: "Caladea", Georgia, serif; --body: "Source Sans 3", sans-serif;
}
html, body { margin: 0; min-height: 100%; background: var(--night); color: var(--bronze); font: 16px/1.4 var(--body); }
main { max-width: 640px; margin: 0 auto; padding: 28px 24px 40px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px;
         border-bottom: 2px solid var(--bronze); padding-bottom: 10px; margin-bottom: 8px; }
h1 { font: 400 30px var(--display); letter-spacing: .18em; margin: 0; color: var(--ember); }
h2 { font: 600 13px var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--dust);
     margin: 26px 0 10px; }
.row { display: grid; grid-template-columns: 160px 1fr; gap: 6px 16px; align-items: center; margin: 12px 0; }
.row > label { color: var(--bronze); }
.hint { grid-column: 2; color: var(--dust); font-size: 14px; margin: 0; }
input[type=text], select { font: 16px var(--body); color: var(--bronze); background: var(--row);
  border: 1.5px solid var(--rule); border-radius: 8px; padding: 8px 10px; width: 100%; box-sizing: border-box; }
input[type=text]:focus, select:focus { outline: none; border-color: var(--ember); }
button { font: 600 15px var(--body); letter-spacing: .04em; color: var(--bronze); background: transparent;
         border: 1.5px solid var(--rule); border-radius: 8px; padding: 8px 16px; cursor: pointer; }
button:hover { border-color: var(--dust); }
button.primary { border-color: var(--ember); color: var(--ember); }
button:disabled { opacity: .5; cursor: default; }
.status { display: flex; align-items: center; gap: 8px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--dust); flex: none; }
.dot.on { background: var(--ember); }
.dot.bad { background: var(--alarm); }
.error { color: var(--alarm); }
.actions { display: flex; gap: 12px; align-items: center; margin-top: 30px; padding-top: 16px; border-top: 1px solid var(--rule); }
.actions .error { margin: 0; }
[hidden] { display: none !important; }
@media (max-width: 520px) { .row { grid-template-columns: 1fr; } .hint { grid-column: 1; } }
</style>
</head>
<body>
<main>
  <header><h1>PETASOS</h1><button id="back" type="button" hidden>Cancel</button></header>
  <form id="form">
    <h2>Sign in to Hermes</h2>
    <p class="hint" style="margin:0 0 6px">The same address and sign-in as the Hermes dashboard. Petasos keeps its own renewable sign-in, like the Car Thing.</p>
    <div class="row">
      <label for="server">Hermes address</label>
      <input type="text" id="server" autocomplete="url" spellcheck="false" placeholder="http://10.0.0.20:9119">
    </div>
    <div class="row">
      <label for="username">Username</label>
      <input type="text" id="username" autocomplete="username" spellcheck="false">
    </div>
    <div class="row">
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password">
    </div>
    <div class="actions">
      <button type="submit" class="primary" id="go">Sign In</button>
      <p class="error" id="error" hidden></p>
    </div>
  </form>
</main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const fail = (m) => { $("error").textContent = m; $("error").hidden = !m; };

fetch("/app/signin", { cache: "no-store" }).then((r) => r.json()).then((s) => {
  $("server").value = s.server || "";
  $("username").value = s.username || "";
  $("back").hidden = !!s.needed; // signing in again can be called off; a first sign-in can't
  ($("username").value ? $("password") : $("username")).focus();
}).catch(() => {});

$("back").addEventListener("click", () => { location.href = "/"; });

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  fail("");
  $("go").disabled = true;
  $("go").textContent = "Signing in…";
  try {
    const res = await fetch("/app/signin", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ server: $("server").value.trim(), username: $("username").value.trim(), password: $("password").value }) });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.error || `Signing in failed (HTTP ${res.status}).`);
    $("go").textContent = "Starting…";
    await new Promise((r) => setTimeout(r, 1500));
    for (let i = 0; i < 60; i++) { // the program restarts signed in
      try { const r = await fetch("/app/settings", { cache: "no-store" }); if (r.ok) break; } catch (_) {}
      await new Promise((r) => setTimeout(r, 500));
    }
    location.href = "/";
  } catch (err) {
    fail(String(err.message || err));
    $("go").disabled = false;
    $("go").textContent = "Sign In";
  }
});
</script>
</body>
</html>

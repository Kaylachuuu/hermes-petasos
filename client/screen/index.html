<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Petasos</title>
<style>
/* The Car Thing's screen, 800x480. 1cqw is 8 pixels; the layout follows the splash. */
@font-face { font-family: "Caladea"; src: url(fonts/caladea.woff2) format("woff2"); font-weight: 400; }
@font-face { font-family: "Source Sans 3"; src: url(fonts/source-sans-3.woff2) format("woff2"); font-weight: 400 600; }
:root {
  --night: #1f1b17; --bronze: #c9b48a; --dust: #9c8a68; --ember: #d97a3a; --alarm: #d9543a;
  --rule: #3a2f25; --row: #2a1f16;
  --display: "Caladea", Georgia, serif; --body: "Source Sans 3", sans-serif;
}
html, body { margin: 0; height: 100%; background: var(--night); overflow: hidden; cursor: none; }
.screen { container-type: inline-size; position: relative; width: 100vw; height: 100vh; overflow: hidden;
          font-family: var(--body); color: var(--bronze); --a: var(--ember); }
[hidden] { display: none !important; }

/* Four equal columns, one under each preset button, one line each. The one opening the page
   showing lights in its colour (--a); dots at the right say which set of soft keys this is. */
.topbar { position: absolute; left: 0; right: 0; top: 0; height: 7cqw; display: grid;
          grid-template-columns: repeat(4, 1fr); align-items: center; }
.topbar > span { text-align: center; font-size: 2.4cqw; letter-spacing: .06em; padding: 0 1.25cqw;
                 white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar > span.off { color: #5a4f42; }
.topbar > span.tab, .topbar > span.on { color: var(--a); }
.sets { position: absolute; right: 1.25cqw; top: 5.6cqw; display: flex; gap: .6cqw; }
.sets i { width: .75cqw; height: .75cqw; border-radius: 50%; background: #5a4f42; }
.sets i.on { background: var(--bronze); }
/* The link icons stand in a column at the left edge, between the two meanders, on every page. */
.links { position: absolute; left: 2cqw; top: 14.5cqw; height: 38.25cqw; display: flex; flex-direction: column;
         justify-content: center; align-items: center; gap: 2.4cqw; z-index: 1; }
.links svg { width: 3.6cqw; height: 3.6cqw; color: var(--link, var(--dust)); }
.links svg.lost { color: var(--alarm); }
.band { position: absolute; left: 0; right: 0; height: 6cqw; display: block; }
.band.top { top: 7.25cqw; } .band.bottom { top: 54cqw; }

.middle { position: absolute; left: 0; right: 0; top: 13.25cqw; height: 40.75cqw; display: flex; flex-direction: column;
          align-items: center; justify-content: center; text-align: center; gap: 1.6cqw; }
.with-song .middle { height: 35cqw; }
.greek { font-family: var(--display); color: var(--ember); font-size: 9cqw; line-height: 1; letter-spacing: .24em; margin-right: -.24em; }
.latin { font-family: var(--display); font-size: 3.6cqw; letter-spacing: .5em; margin-right: -.5em; }
.motto { font-size: 2.2cqw; letter-spacing: .45em; margin-right: -.45em; color: var(--dust); }
.hint { font-size: 2.75cqw; letter-spacing: .02em; margin-top: 1.2cqw; max-width: 64cqw; }
.hint.wait { color: var(--dust); }
.hint.live { color: var(--ember); font-family: var(--display); font-size: 3.2cqw; letter-spacing: .12em; animation: breathe 1.8s ease-in-out infinite; }
@keyframes breathe { 50% { opacity: .55 } }
.heard { font-size: 2.6cqw; color: var(--dust); font-style: italic; max-width: 76cqw;
         display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.speaking { position: absolute; left: 9.5cqw; right: 8cqw; top: 15cqw; height: 37.5cqw; overflow: hidden;
            display: flex; flex-direction: column; justify-content: center; }
.with-song .speaking { height: 32.5cqw; }
.speaking b { display: block; color: var(--ember); font-weight: 400; font-family: var(--display); font-size: 2.2cqw;
              letter-spacing: .45em; margin-bottom: 1cqw; }
.reply { font-family: var(--display); font-size: 3.4cqw; line-height: 1.4; }
.reply.long { font-size: 3cqw; }
.emblem { position: absolute; right: 4cqw; top: 24cqw; width: 16cqw; }
/* The song playing, just above its progress along the bottom meander. */
.song { position: absolute; left: 9cqw; right: 9cqw; top: 48.6cqw; text-align: center; font-size: 2.3cqw; letter-spacing: .04em;
        color: var(--song, var(--dust)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.song b { font-weight: 400; color: var(--bronze); }

/* Settings: the Bluetooth and Screen tabs */
.bt { position: absolute; left: 0; right: 0; top: 14cqw; bottom: 8cqw;
      display: flex; flex-direction: column; padding: 1.2cqw 5cqw 1cqw; gap: 1cqw; }
.bt h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 3.2cqw; letter-spacing: .12em; }
.bt .note { color: var(--dust); font-size: 2.2cqw; line-height: 1.35; margin: 0; }
.bt .list { flex: 1; overflow: hidden; display: flex; flex-direction: column; gap: .6cqw; }
.bt h3 { margin: .8cqw 0 0; font-family: var(--display); font-weight: 400; font-size: 2.1cqw; letter-spacing: .28em;
         text-transform: uppercase; color: var(--dust); flex: none; }
.bt .empty { color: #6b5f50; font-size: 2.2cqw; padding: .4cqw 1.8cqw; flex: none; }
.row { display: grid; grid-template-columns: 3.4cqw 1fr auto; align-items: center; gap: 1.6cqw; padding: 1cqw 1.8cqw;
       font-size: 2.6cqw; border: .15cqw solid transparent; border-radius: .8cqw; flex: none; }
.row svg { width: 3cqw; height: 3cqw; }
.row em { font-style: normal; font-size: 2cqw; color: var(--dust); }
.row.hot em { color: var(--ember); }
.row em.sub { display: block; margin-top: .2cqw; } /* a row with a value says what pressing it does under its name */
.row.sel { border-color: var(--ember); background: var(--row); }
.row b { font-weight: 400; font-size: 2.4cqw; color: var(--bronze); white-space: nowrap; }
.row.edit b { color: var(--ember); }
.row.edit b::before { content: "‹  "; } .row.edit b::after { content: "  ›"; }

.pair { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 1.4cqw; }
.pair .code { font-family: var(--display); font-size: 9cqw; letter-spacing: .14em; color: var(--ember); font-variant-numeric: tabular-nums; }
.pair .note { max-width: 70cqw; font-size: 2.5cqw; }
/* The on-screen keyboard, for typing a name or a soft key's question with a finger or the knob. */
.kb { flex: 1; display: flex; flex-direction: column; gap: .7cqw; touch-action: none; user-select: none; }
.kb .field { display: flex; align-items: baseline; gap: 1.6cqw; border-bottom: .15cqw solid var(--dust); padding: 0 .6cqw .5cqw; }
.kb .field span { font-family: var(--display); font-size: 2.3cqw; letter-spacing: .2em; text-transform: uppercase; color: var(--dust); flex: none; }
.kb .text { flex: 1; font-size: 3cqw; white-space: pre; overflow: hidden; direction: rtl; text-align: left; }
.kb .text bdi::after { content: ""; display: inline-block; width: .25cqw; height: 3cqw; margin-left: .2cqw; vertical-align: -.4cqw;
                       background: var(--ember); animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.kb .count { font-size: 1.8cqw; color: #6b5f50; flex: none; }
.kb .krow { display: flex; gap: .7cqw; justify-content: center; flex: 1; }
.kb .k { flex: 1; max-width: 7.6cqw; display: flex; align-items: center; justify-content: center; font-size: 2.7cqw;
         border: .15cqw solid var(--rule); border-radius: .7cqw; background: #261d15; color: var(--bronze); }
.kb .k.wide { max-width: 12cqw; font-size: 2.1cqw; letter-spacing: .06em; }
.kb .k.space { max-width: 34cqw; }
.kb .k.done { color: var(--ember); border-color: var(--ember); }
.kb .k.sel { border-color: var(--ember); background: var(--row); }
.kb .k.down { background: var(--ember); color: var(--night); }
.kb .k.on { color: var(--ember); }
.keys { position: absolute; left: 0; right: 0; bottom: 0; height: 8cqw; display: flex; justify-content: center; align-items: center;
        gap: 4cqw; border-top: .15cqw solid var(--rule); font-size: 2cqw; color: var(--dust); }
.keys b { color: var(--bronze); font-weight: 600; }

/* The music pages: one view at a time between the meanders, chosen with the soft keys: what's
   playing, with big controls, or one of the lists. The page's colour is --a. */
.page { position: absolute; left: 8cqw; right: 3cqw; top: 14cqw; height: 39.25cqw; display: flex; flex-direction: column; }
.page button { font: inherit; color: var(--bronze); background: transparent; border: 0; padding: 0; display: flex;
               align-items: center; justify-content: center; touch-action: manipulation; }
.npv { flex: 1; display: grid; grid-template-columns: 24.5cqw 1fr; gap: 3.5cqw; align-items: center; padding: 0 1.5cqw; min-height: 0; }
.npv .art { width: 24.5cqw; height: 24.5cqw; border-radius: 1.25cqw; background: var(--row) center / cover no-repeat;
            display: flex; align-items: center; justify-content: center; }
.npv .art svg { width: 10cqw; height: 10cqw; color: var(--a); opacity: .7; }
.npv .meta { display: flex; flex-direction: column; gap: .75cqw; min-width: 0; }
.npv .src { font-family: var(--display); font-size: 1.9cqw; letter-spacing: .28em; text-transform: uppercase; color: var(--a); }
.npv .title { font-family: var(--display); font-size: 4.25cqw; line-height: 1.15;
              display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.npv .artist { font-size: 2.6cqw; color: var(--dust); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.npv .times { display: flex; justify-content: space-between; font-size: 1.9cqw; color: var(--dust); margin-top: 1.25cqw;
              font-variant-numeric: tabular-nums; max-width: 52.5cqw; }
.npv .ctl { display: flex; align-items: center; justify-content: space-between; margin-top: 1cqw; max-width: 52.5cqw; }
.npv .ctl button { width: 8cqw; height: 8cqw; border-radius: 50%; }
.npv .ctl button svg { width: 4.25cqw; height: 4.25cqw; }
.npv .ctl button.big { width: 10cqw; height: 10cqw; border: .25cqw solid var(--a); color: var(--a); }
.npv .ctl button.big svg { width: 5cqw; height: 5cqw; }
.npv .ctl button.on { color: var(--a); }
.npv .ctl button.off { color: #5a4f42; }
.npv .ctl button:active, .lib .tr:active, .lib .pl:active { background: var(--row); }
.pnote { flex: none; text-align: center; color: var(--dust); font-size: 2.1cqw; padding-bottom: .6cqw; }
.lib { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.lib .list { flex: 1; overflow-y: auto; overflow-x: hidden; touch-action: pan-y; scrollbar-width: none; overscroll-behavior: contain; }
.lib .list::-webkit-scrollbar { display: none; }
.lib .tr, .lib .pl, .lib .head, .lib .find { display: grid; grid-template-columns: 5.4cqw 1fr auto; align-items: center; gap: 1.75cqw;
             padding: .7cqw 1cqw; border-radius: .8cqw; }
.lib .sel { outline: .2cqw solid var(--a); outline-offset: -.2cqw; background: var(--row); }
.lib .thumb { width: 5.4cqw; height: 5.4cqw; border-radius: .6cqw; background: var(--row) center / cover no-repeat;
              display: flex; align-items: center; justify-content: center; }
.lib .thumb svg { width: 2.6cqw; height: 2.6cqw; color: var(--dust); }
.lib .tr div, .lib .pl div { min-width: 0; }
.lib b { display: block; font-weight: 400; font-size: 2.4cqw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lib span { display: block; font-size: 1.8cqw; color: var(--dust); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lib em { font-style: normal; font-size: 1.8cqw; color: var(--dust); font-variant-numeric: tabular-nums; }
.lib .tr.now b { color: var(--a); }
.lib .head { grid-template-columns: 3cqw 1fr auto; color: var(--dust); font-size: 2.2cqw; }
.lib .head svg { width: 2.8cqw; height: 2.8cqw; }
.lib .head em { font-size: 1.8cqw; }
.lib .find { grid-template-columns: 3cqw 1fr; border: .15cqw solid var(--rule); margin-bottom: .8cqw; font-size: 2.3cqw; color: var(--dust); }
.lib .find svg { width: 2.8cqw; height: 2.8cqw; }
.lib .note { color: var(--dust); font-size: 2.2cqw; line-height: 1.4; padding: 2cqw 1cqw; text-align: center; }
.mp-kb { position: absolute; left: 0; right: 0; top: 7cqw; bottom: 0; display: flex; flex-direction: column; padding: 2cqw 5cqw 2.4cqw;
         background: var(--night); z-index: 2; }
.kb .kx { flex: none; font-size: 3cqw; color: var(--dust); padding: 0 .6cqw; }

/* A new petasos downloading: over whatever page shows, between the meanders, with the bottom
   one filling as it comes in. */
.update { position: absolute; left: 0; right: 0; top: 13.25cqw; height: 40.75cqw; background: var(--night); z-index: 4;
          display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.6cqw; text-align: center; }
.update h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 2.2cqw; letter-spacing: .45em; margin-right: -.45em; color: var(--dust); }
.update .ver { font-family: var(--display); font-size: 5.5cqw; letter-spacing: .12em; color: var(--ember); }
.update .bar { width: 50cqw; height: .9cqw; border-radius: .45cqw; background: var(--rule); overflow: hidden; margin-top: 1cqw; }
.update .bar i { display: block; height: 100%; width: 0; background: var(--ember); transition: width .25s linear; }
.update .note { font-size: 2.4cqw; color: var(--dust); font-variant-numeric: tabular-nums; }

/* A passing note in the middle of the screen: the mic turned off or on. */
.toast { position: absolute; left: 50%; top: 33.75cqw; transform: translate(-50%, -50%); background: #261d15;
         border: .2cqw solid var(--a); border-radius: 1.4cqw; padding: 2cqw 3.5cqw; display: flex; align-items: center; gap: 1.75cqw;
         font-family: var(--display); font-size: 3.2cqw; letter-spacing: .08em; color: var(--a);
         box-shadow: 0 1cqw 4cqw rgba(0,0,0,.6); z-index: 6; }
.toast svg { width: 4cqw; height: 4cqw; }

/* Held: what letting go of the knob (or another control with holds) would do now. */
.holdpop { position: absolute; left: 50%; top: 56%; transform: translate(-50%, -50%); width: 46cqw; box-sizing: border-box;
           background: #261d15; border: .2cqw solid var(--a); border-radius: 1.4cqw; padding: 2cqw 2.6cqw 2.2cqw;
           box-shadow: 0 1cqw 4cqw rgba(0,0,0,.6); display: flex; flex-direction: column; gap: 1cqw; z-index: 5; }
.holdpop h4 { margin: 0 0 .4cqw; font-family: var(--display); font-weight: 400; font-size: 2.1cqw; letter-spacing: .28em;
              text-transform: uppercase; color: var(--dust); }
.holdpop .step { display: grid; grid-template-columns: 2cqw 1fr auto; align-items: center; gap: 1.4cqw; font-size: 2.8cqw; color: #6b5f50; }
.holdpop .step i { width: 1.4cqw; height: 1.4cqw; border-radius: 50%; border: .2cqw solid currentColor; }
.holdpop .step em { font-style: normal; font-size: 1.9cqw; }
.holdpop .step.on { color: var(--a); font-family: var(--display); }
.holdpop .step.on i { background: var(--a); }
.holdpop .step.past { color: var(--dust); }
.holdpop .track { position: relative; height: .7cqw; border-radius: .35cqw; background: var(--rule); margin-top: .8cqw; }
.holdpop .track .fill { height: 100%; width: 0; border-radius: .35cqw; background: var(--a); }
.holdpop .track .tick { position: absolute; top: -.5cqw; width: .25cqw; height: 1.7cqw; background: var(--bronze); }

/* The virtual Petasos (the Mac and Windows apps): the screen above, its controls below, sized
   together from --w so they scale as one 800:544 picture, the screen keeping the Car Thing's 5:3.
   A window of another shape gets bands of night at its sides or top and bottom. */
body.virtual { cursor: default; }
body.virtual { --w: min(100vw, calc(100vh * 800 / 544)); display: flex; flex-direction: column;
               align-items: center; justify-content: center; }
body.virtual .screen { width: var(--w); height: calc(var(--w) * 0.6); flex: none; }
body.virtual .topbar > span { cursor: pointer; border-radius: .6cqw; }
body.virtual .topbar > span:hover { background: var(--row); }
.controls { flex: none; width: var(--w); box-sizing: border-box; height: calc(8 * var(--w) / 100); display: flex; align-items: center;
            justify-content: center; gap: calc(1.25 * var(--w) / 100); border-top: 2px solid var(--bronze); background: var(--night);
            font-family: var(--body); }
.controls button { font: 600 calc(1.75 * var(--w) / 100) var(--body); letter-spacing: .04em; color: var(--bronze); background: transparent;
                   border: 1.5px solid var(--rule); border-radius: calc(1 * var(--w) / 100); height: calc(4.75 * var(--w) / 100); padding: 0 calc(1.75 * var(--w) / 100); cursor: pointer;
                   display: inline-flex; align-items: center; gap: calc(1 * var(--w) / 100); }
.controls button:hover { border-color: var(--dust); }
.controls button.down, .controls button.on { border-color: var(--ember); color: var(--ember); background: var(--row); }
.controls button.talk { min-width: calc(18.75 * var(--w) / 100); justify-content: center; }
.controls kbd { font: calc(1.5 * var(--w) / 100) var(--body); color: var(--dust); border: 1px solid var(--rule); border-radius: calc(0.5 * var(--w) / 100); padding: 0 calc(0.625 * var(--w) / 100); }
.controls svg { width: calc(2.25 * var(--w) / 100); height: calc(2.25 * var(--w) / 100); }
</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <pattern id="key-band" width="40" height="60" patternUnits="userSpaceOnUse">
      <path d="M4 48 V13 H33 V42 H13 V22 H24 V33" fill="none" stroke="#c9b48a" stroke-width="3.5" stroke-linecap="square"/>
      <path d="M4 48 H40" fill="none" stroke="#c9b48a" stroke-width="3.5"/>
    </pattern>
    <pattern id="key-band-ember" width="40" height="60" patternUnits="userSpaceOnUse">
      <path d="M4 48 V13 H33 V42 H13 V22 H24 V33" fill="none" stroke="#e8823a" stroke-width="3.5" stroke-linecap="square"/>
      <path d="M4 48 H40" fill="none" stroke="#e8823a" stroke-width="3.5"/>
    </pattern>
    <pattern id="key-small" width="12" height="16" patternUnits="userSpaceOnUse">
      <path d="M1 14 V2 H10 V12 H4 V5 H7 V9" fill="none" stroke="#d97a3a" stroke-width="1.5" stroke-linecap="square"/>
      <path d="M1 14 H12" fill="none" stroke="#d97a3a" stroke-width="1.5"/>
    </pattern>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".25"/><stop offset=".55" stop-color="#fff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="fade" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="190"><rect width="200" height="190" fill="url(#glow)"/></mask>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <symbol id="i-phone" viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M11 18.5h2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-network" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2.5 9a14 14 0 0 1 19 0M5.5 12.5a9.5 9.5 0 0 1 13 0M8.6 16a5 5 0 0 1 6.8 0"/></g><circle cx="12" cy="19.2" r="1.5" fill="currentColor"/></symbol>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const icon = (name) => `<svg><use href="#i-${name}"/></svg>`;
const rest = (a) => state && state.virtual ? `Hold Space to talk to ${a}`
                                           : `Hold the front button to talk to ${a}`;
let state = null, noticeSeen = 0, noticeUntil = 0, lastReply = "", scrollAnim = null, micNoteSeen = null;

function warning(s) {
  const l = s.links, a = s.agent;
  if (!l.checked) return "";
  if (!l.phone_paired) return "Pair your phone: hold the mic button for two seconds";
  if (!l.phone) return s.virtual ? "This Mac isn't online" : `Turn on Personal Hotspot to reach ${a}`;
  if (!l.home) return `Can't reach ${a}'s server`;
  if (!l.speaker_paired) return "Pair a speaker: hold the mic button for two seconds";
  if (!l.speaker) return `Turn on ${l.speaker_name || "the speaker"} to hear ${a}`;
  return "";
}

// In the settings the preset buttons are its tabs.
const TABS = [["bluetooth", "Bluetooth"], ["screen", "Screen"], ["device", "Device"], ["music", "Music"]];

// Each page's colours: the meander's own, its dim one (under a level), the lit one, and the
// accent for text and buttons.
const THEMES = {
  petasos: { band: "#c9b48a", dim: "#4a3f30", lit: "#e8823a", accent: "#d97a3a", name: "Petasos" },
  soundcloud: { band: "#ff8a3d", dim: "#5a3a22", lit: "#ff8a3d", accent: "#ff8a3d", name: "SoundCloud" },
  navidrome: { band: "#5b9ee8", dim: "#24364d", lit: "#5b9ee8", accent: "#5b9ee8", name: "Navidrome" },
  spotify: { band: "#4cc879", dim: "#24452f", lit: "#4cc879", accent: "#4cc879", name: "Spotify" },
  apple: { band: "#f0505a", dim: "#4f2427", lit: "#f0505a", accent: "#f0505a", name: "Apple Music" },
};
(function makePatterns() {
  const pat = (id, c) => `<pattern id="${id}" width="40" height="60" patternUnits="userSpaceOnUse">
    <path d="M4 48 V13 H33 V42 H13 V22 H24 V33" fill="none" stroke="${c}" stroke-width="3.5" stroke-linecap="square"/>
    <path d="M4 48 H40" fill="none" stroke="${c}" stroke-width="3.5"/></pattern>`;
  let html = "";
  for (const [k, t] of Object.entries(THEMES)) html += pat("b-" + k, t.band) + pat("d-" + k, t.dim) + pat("l-" + k, t.lit);
  document.querySelector("svg defs").insertAdjacentHTML("beforeend", html);
})();

// The page showing: a music page's name, or "petasos" for home (also while Athena is busy, when
// the music page steps aside) and the settings.
// pageMusic is the music a page shows: only its own service's (a phone's music of no app we know
// goes to Apple Music's), so a page doesn't show another service's song in its colours.
function pageMusic(s, page) {
  const m = s.music;
  if (!m || page === "petasos") return m;
  return m.service === page || (!m.service && !m.library && page === "apple") ? m : null;
}

function shownPage(s) {
  return s.page && !s.bt && !s.update && s.phase === "idle" && THEMES[s.page] ? s.page : "petasos";
}

function drawTop(s) {
  const page = shownPage(s), music = !s.bt && page !== "petasos";
  // On a music page the soft keys are its own: what's playing and its lists (none on Apple Music's).
  const views = music ? [["now", "Now Playing"], ...PAGES[page].tabs] : [];
  s.presets.forEach((label, i) => {
    const el = $("p" + i);
    if (s.bt) {
      const [tab, name] = TABS[i];
      el.textContent = name || "—";
      el.className = !name ? "off" : tab === s.bt.tab ? "tab" : "";
      return;
    }
    if (music) {
      const [view, name] = page === "apple" ? [] : views[i] || [];
      el.textContent = name || "—";
      el.className = !name ? "off" : view === (s.view || "now") ? "on" : "";
      return;
    }
    el.textContent = label || "—";
    el.className = !label ? "off" : (s.key_pages || [])[i] === page ? "on" : "";
  });
  const sets = $("sets");
  sets.hidden = !!s.bt || music || !(s.key_sets > 1);
  [...sets.children].forEach((dot, i) => dot.classList.toggle("on", i + 1 === (s.keys || 1)));
  const l = s.links, checked = l.checked;
  $("l-phone").classList.toggle("lost", checked && !l.phone);
  if (s.virtual) { // the network icon: a shield while Hermes is reached through the VPN
    $("l-phone").firstElementChild.setAttribute("href", l.tunnel ? "#i-shield" : "#i-network");
    $("l-phone").setAttribute("title", l.tunnel ? "Online; reaching " + s.agent + " through the VPN" : "Online");
  }
  $("l-home").classList.toggle("lost", checked && !l.home);
  $("l-speaker").classList.toggle("lost", checked && !l.speaker);
  const mic = $("l-mic");
  mic.classList.toggle("lost", s.muted);
  mic.firstElementChild.setAttribute("href", s.muted ? "#i-mic-off" : "#i-mic");
}

// --- the meanders ---------------------------------------------------------------------------------

// The top one shows the volume as it changes, then the sound: your voice while Athena listens,
// and her voice or the music as it plays, under a mark at the volume. A music page keeps the
// volume lit when there's no sound to show. The bottom one is the song's progress, in its
// service's colour.
let volumeSeen = null, volumeUntil = 0, micTarget = 0, micShown = 0, lvlTarget = 0, lvlShown = 0, bandFrame = 0;
const bandsDrawn = {};

function setBand(id, b) {
  const t = THEMES[b.theme] || THEMES.petasos, key = JSON.stringify(b);
  if (bandsDrawn[id] === key) return;
  bandsDrawn[id] = key;
  const el = $(id), w = (1000 * Math.max(0, Math.min(1, b.lit || 0))).toFixed(1);
  const part = (c) => el.querySelector("." + c);
  part("base").setAttribute("fill", `url(#${b.dim ? "d" : "b"}-${b.theme})`);
  part("cover").setAttribute("width", w);
  part("lit").setAttribute("width", w);
  part("lit").setAttribute("fill", `url(#l-${b.theme})`);
  part("rule").setAttribute("stroke", b.dim ? t.dim : t.band);
  part("litrule").setAttribute("d", b.dim ? `M0 2 H${w} M0 58 H${w}` : "M0 2 H0");
  part("litrule").setAttribute("stroke", t.lit);
  part("mark").setAttribute("x", b.mark == null ? -10 : (1000 * b.mark - 4).toFixed(1));
  part("mark").setAttribute("fill", t.lit);
}

function musicProgress(m) {
  if (!m || !m.seconds) return 0;
  const pos = (m.position || 0) + (m.moving && m.playing ? (Date.now() - m.at) / 1000 : 0);
  return Math.min(1, pos / m.seconds);
}

function drawBands() {
  const s = state;
  if (!s) return;
  const page = shownPage(s), onMusic = page !== "petasos";
  const vol = s.volume >= 0 ? s.volume / 100 : null;
  let top;
  if (s.bt) top = { theme: "petasos", lit: (s.bt.meter || 0) / 100 };
  else if (Date.now() < volumeUntil && vol != null) top = { theme: page, dim: onMusic, lit: vol };
  else if (s.phase === "listening") top = { theme: "petasos", lit: micShown };
  else if (lvlTarget > 0 || lvlShown > 0.01) top = { theme: page, dim: true, lit: lvlShown * (vol ?? 1), mark: vol };
  else if (onMusic) top = { theme: page, dim: true, lit: vol ?? 0 };
  else top = { theme: "petasos", lit: 0 };
  setBand("top-band", top);
  const m = pageMusic(s, page), service = m && THEMES[m.service] ? m.service : onMusic ? page : "";
  $("bottom-band").style.display = s.bt ? "none" : "";
  if (s.update) { setBand("bottom-band", { theme: "petasos", dim: true, lit: s.update.size ? s.update.got / s.update.size : 0 }); return; }
  setBand("bottom-band", m && service ? { theme: service, dim: true, lit: musicProgress(m) }
                                      : { theme: onMusic ? page : "petasos", dim: onMusic, lit: m ? musicProgress(m) : 0 });
}

// stepBands eases the levels towards where they're heading, a frame at a time, while they move.
function stepBands() {
  bandFrame = 0;
  const ease = (shown, target) => {
    shown += (target - shown) * (target > shown ? 0.5 : 0.15);
    return Math.abs(target - shown) < 0.005 ? target : shown;
  };
  micShown = ease(micShown, state && state.phase === "listening" ? micTarget : 0);
  lvlShown = ease(lvlShown, lvlTarget);
  drawBands();
  if (micShown !== (state && state.phase === "listening" ? micTarget : 0) || lvlShown !== lvlTarget) bandFrame = requestAnimationFrame(stepBands);
}

function moveBands() {
  if (!bandFrame) bandFrame = requestAnimationFrame(stepBands);
}

function drawVolume(s) {
  if (volumeSeen === null) { volumeSeen = s.volume_id; return; } // not on first load
  if (s.volume_id === volumeSeen || s.volume < 0) return;
  volumeSeen = s.volume_id;
  volumeUntil = Date.now() + 2000;
  setTimeout(drawBands, 2050);
}

// The song's progress moves on by itself between updates.
let progressTimer = 0;
function stepProgress() {
  clearTimeout(progressTimer);
  const m = state && pageMusic(state, shownPage(state));
  drawBands();
  if (!$("mpage").hidden) {
    const len = m && m.seconds || 0;
    const pos = m ? (m.position || 0) + (m.moving && m.playing ? (Date.now() - m.at) / 1000 : 0) : 0;
    $("mp-pos").textContent = len ? clock(Math.min(pos, len)) : "";
    $("mp-len").textContent = len ? clock(len) : "";
  }
  if (m && m.moving && m.playing) progressTimer = setTimeout(stepProgress, 500);
}

function drawHome(s) {
  drawSong(s);
  const speaking = s.phase === "speaking" && s.reply;
  $("stack").hidden = !!speaking;
  $("speaking").hidden = !speaking;
  if (speaking) {
    drawReply(s);
    showEmblem(false);
    return;
  }
  lastReply = "";
  const thinking = s.phase === "thinking";
  $("latin").hidden = $("motto").hidden = thinking && !!s.heard;
  $("heard").hidden = !(thinking && s.heard);
  $("heard").textContent = s.heard ? `“${s.heard}”` : "";
  if (s.notice_id && s.notice_id !== noticeSeen) {
    noticeSeen = s.notice_id;
    noticeUntil = Date.now() + 4000;
    setTimeout(() => state && draw(state), 4100);
  }
  const warn = warning(s);
  const a = s.agent;
  let text = rest(a), cls = "";
  if (s.phase === "ready") [text, cls] = ["Getting ready…", "wait"];
  else if (s.phase === "listening") [text, cls] = [`${a} is listening`, "live"];
  else if (thinking) [text, cls] = [`${a} is thinking…`, "wait"];
  else if (Date.now() < noticeUntil && s.notice) [text, cls] = [s.notice, "wait"];
  else if (warn) [text, cls] = [warn, "wait"];
  else if (s.muted) [text, cls] = [s.virtual ? "The mic is off. Hold Return to turn it on." : "The mic is off. Hold the knob to turn it on.", "wait"];
  const hint = $("hint");
  hint.textContent = text;
  hint.className = "hint " + cls;
  showEmblem(s.phase === "idle" && !!warn && !(Date.now() < noticeUntil && s.notice));
}

// The song playing, above its progress on the bottom meander.
function drawSong(s) {
  const m = s.music, on = !!(m && (m.title || m.playing));
  $("song").hidden = !on;
  $("home").classList.toggle("with-song", on);
  if (!on) return;
  const t = THEMES[m.service];
  $("song").style.setProperty("--song", t ? t.accent : "var(--dust)");
  const words = [m.title, m.artist].filter(Boolean);
  $("song").innerHTML = (m.playing ? "♪ " : "Paused · ") + (words.length ? `<b>${esc(words[0])}</b>` + (words[1] ? " · " + esc(words[1]) : "") : esc(m.source || "Music"));
}

// The emblem is an <svg>, which has no hidden property; the attribute works.
function showEmblem(on) {
  $("warn").toggleAttribute("hidden", !on);
}

// A long reply scrolls up through the panel over the time it takes to play.
function drawReply(s) {
  if (s.reply === lastReply) return;
  lastReply = s.reply;
  const reply = $("reply"), scroller = $("scroller"), box = $("speaking");
  reply.textContent = s.reply;
  reply.classList.toggle("long", s.reply.length > 220);
  if (scrollAnim) scrollAnim.cancel();
  scrollAnim = null;
  const extra = scroller.scrollHeight - box.clientHeight;
  if (extra > 0 && s.reply_ms > 0) {
    const ms = s.reply_ms;
    scrollAnim = scroller.animate(
      [{ transform: "translateY(0)", offset: 0 }, { transform: "translateY(0)", offset: 0.12 },
       { transform: `translateY(${-extra}px)`, offset: 0.95 }, { transform: `translateY(${-extra}px)`, offset: 1 }],
      { duration: ms, fill: "forwards", easing: "linear" });
  }
}

function drawBT(b) {
  const keys = { list: [["Knob", "choose"], ["Press", "open"], ["Front button", "close"]],
                 device: [["Knob", "choose"], ["Press", "do it"], ["Front button", "back"]],
                 scan: [["Knob", "choose"], ["Press", "pair"], ["Front button", "back"]],
                 pair: b.asking ? [["Press", "pair"], ["Front button", "decline"]] : [],
                 screen: b.editing ? [["Knob", "change"], ["Press", "done"]] : [["Knob", "choose"], ["Press", "change"], ["Front button", "close"]],
                 mine: [["Knob", "choose"], ["Press", "change"], ["Front button", "close"]],
                 music: [["Knob", "choose"], ["Press", "change"], ["Front button", "close"]],
                 softkey: b.editing ? [["Knob", "change"], ["Press", "done"]] : [["Knob", "choose"], ["Press", "change"], ["Front button", "back"]],
                 keyboard: [["Touch or knob", "type"], ["Done", "save"], ["Front button", "cancel"]],
                 message: [] }[b.view] || [];
  $("bt-keys").innerHTML = keys.map(([k, v]) => `<span><b>${k}</b> ${v}</span>`).join("");
  const body = $("bt-body");
  // The top meander lights up to a level (the Screen tab's brightness or dim level) the way the
  // volume lights it at home (drawBands).
  if (b.view === "keyboard") { drawKeyboard(b); return; }
  kb = null;
  if (b.view === "pair" || b.view === "message") {
    body.innerHTML = `<div class="pair">${b.view === "pair" ? `<p class="note" style="margin:0">Pair with</p>` : ""}
      <h2>${esc(b.title)}</h2>${b.code ? `<div class="code">${esc(b.code)}</div>` : ""}
      <p class="note">${esc(b.note)}</p></div>`;
    return;
  }
  const rows = (b.items || []).map((it, i) => {
    if (it.kind === "header") return `<h3>${esc(it.label)}</h3>`;
    if (it.kind === "note") return `<div class="empty">${esc(it.label)}</div>`;
    const sel = i === b.sel;
    return `<div class="row${sel ? " sel" : ""}${sel && b.editing ? " edit" : ""}${it.hot ? " hot" : ""}" id="${sel ? "sel" : ""}">
      ${icon(it.icon || "device")}<span>${esc(it.label)}${it.value && it.detail ? `<em class="sub">${esc(it.detail)}</em>` : ""}</span>${it.value ? `<b>${esc(it.value)}</b>` : `<em>${esc(it.detail)}</em>`}</div>`;
  }).join("");
  body.innerHTML = (b.title ? `<h2>${esc(b.title)}</h2>` : "") + (b.note ? `<p class="note">${esc(b.note)}</p>` : "") +
    `<div class="list">${rows}</div>`;
  const sel = $("sel");
  if (sel) sel.scrollIntoView({ block: "nearest" });
}

// --- the on-screen keyboard ---------------------------------------------------------------------

// The keyboard lives in the page: keys typed by touch, or by turning the knob to one and
// pressing it (petasos passes the knob along as {"kb": ...}). Done sends the text to petasos.
const LAYOUTS = {
  abc: ["q w e r t y u i o p", "a s d f g h j k l '", "⇧ z x c v b n m ⌫", "123 , space . Done"],
  123: ["1 2 3 4 5 6 7 8 9 0", "- / : ; ( ) $ & @ \"", "#+= % + = ? ! * ⌫", "ABC , space . Done"],
  sym: ["[ ] { } # ^ _ ~ < >", "\\ | ` € £ ¥ • ' \" =", "123 % + ? ! * ⌫", "ABC , space . Done"],
};
let kb = null; // { id, text, max, layout, shift, sel }

function kbKeys() {
  return LAYOUTS[kb.layout].map((row) => row.split(" "));
}

function drawKeyboard(b) {
  if (!kb || kb.id !== b.keyboard) {
    kb = { id: b.keyboard, text: b.text || "", max: b.max || 48, layout: "abc", shift: !b.text && !b.plain, sel: 0, sent: false };
    $("bt-body").innerHTML = `<div class="kb" id="kb"></div>`;
    $("kb").addEventListener("pointerdown", (e) => {
      const el = e.target.closest(".k");
      if (!el) return;
      e.preventDefault();
      el.classList.add("down");
      setTimeout(() => el.classList.remove("down"), 120);
      kb.sel = +el.dataset.i;
      kbType(el.dataset.k);
    });
  }
  kb.title = b.title;
  renderKeyboard();
}

function renderKeyboard() {
  const el = $("kb");
  if (!el || !kb) return;
  let i = 0;
  const rows = kbKeys().map((row) => `<div class="krow">${row.map((k) => {
    const n = i++;
    let face = k, cls = "k";
    if (k.length === 1 && kb.shift) face = k.toUpperCase();
    if (k === "space") { face = ""; cls += " space"; }
    if (k === "⇧") cls += kb.shift ? " wide on" : " wide";
    if (k === "⌫" || k === "123" || k === "ABC" || k === "#+=") cls += " wide";
    if (k === "Done") cls += " wide done";
    if (n === kb.sel) cls += " sel";
    return `<div class="${cls}" data-k="${esc(k)}" data-i="${n}">${esc(face)}</div>`;
  }).join("")}</div>`).join("");
  el.innerHTML = `<div class="field"><span>${esc(kb.title)}</span><div class="text"><bdi>${esc(kb.text)}</bdi></div>
    <span class="count">${[...kb.text].length}/${kb.max}</span>${kb.onCancel ? `<span class="kx" data-x="1">×</span>` : ""}</div>${rows}`;
}

function kbType(k) {
  if (!kb || kb.sent) return;
  const chars = [...kb.text];
  if (k === "⌫") chars.pop();
  else if (k === "⇧") { kb.shift = !kb.shift; renderKeyboard(); return; }
  else if (k === "123" || k === "ABC" || k === "#+=") { kb.layout = { "123": "123", "ABC": "abc", "#+=": "sym" }[k]; kb.sel = Math.min(kb.sel, kbKeys().flat().length - 1); renderKeyboard(); return; }
  else if (k === "Done") {
    if (kb.onDone) { kb.onDone(kb.text); return; }
    kb.sent = true;
    fetch("/settings/text", { method: "POST", headers: { "Content-Type": "application/json" },
                              body: JSON.stringify({ keyboard: kb.id, text: kb.text }) })
      .catch(() => { if (kb) kb.sent = false; });
    return;
  } else if (chars.length < kb.max) {
    chars.push(k === "space" ? " " : kb.shift ? k.toUpperCase() : k);
    kb.shift = false;
  }
  kb.text = chars.join("");
  renderKeyboard();
}

function kbKnob(m) {
  if (!kb) return;
  if (m === "press") { kbType(kbKeys().flat()[kb.sel]); return; }
  const n = kbKeys().flat().length;
  kb.sel = Math.max(0, Math.min(n - 1, kb.sel + (m.turn > 0 ? 1 : -1)));
  renderKeyboard();
}

function draw(s) {
  if (s.virtual) setUpControls(s);
  $("motto").textContent = `MESSENGER OF ${s.agent.toUpperCase()}`;
  $("speaker-name").textContent = s.agent.toUpperCase();
  const page = shownPage(s), onMusic = page !== "petasos", t = THEMES[page];
  $("screen").style.setProperty("--a", t.accent);
  $("links").style.setProperty("--link", onMusic ? t.band : "var(--dust)");
  drawTop(s);
  // A music page steps aside for the home screen while the agent is busy.
  $("bt").hidden = !s.bt;
  $("mpage").hidden = !onMusic;
  $("home").hidden = !!s.bt || onMusic;
  $("links").hidden = !!s.bt;
  if (s.bt) drawBT(s.bt);
  else if (onMusic) drawMusicPage(s);
  else drawHome(s);
  if (!onMusic) closeMusicKeyboard();
  drawHold(s);
  drawVolume(s);
  drawMicNote(s);
  drawUpdate(s);
  if (s.phase !== "listening") micTarget = 0;
  drawCapture(s);
  stepProgress();
  moveBands();
}

// --- the music pages -----------------------------------------------------------------------------

// Each page's lists, by the source the plugin browses for it. Apple Music has none: its music is
// chosen on the phone.
const PAGES = {
  soundcloud: { source: "soundcloud", tabs: [["likes", "Likes"], ["playlists", "Playlists"], ["search", "Search"]] },
  navidrome: { source: "navidrome,folders", tabs: [["likes", "Starred"], ["playlists", "Playlists"], ["search", "Search"]] },
  spotify: { source: "spotify", tabs: [["likes", "Liked"], ["playlists", "Playlists"], ["search", "Search"]] },
  apple: { tabs: [] },
};

// What's playing comes with the state. The lists come from /music/browse when a tab first opens
// and stay, so they keep their place while the music plays. Each page keeps its own; mp is the
// one showing. sel is the knob's highlight, counting the view buttons first, then the rows.
const pages = {};
let mp = null, mpName = "", mpOpened = "", mpShown = "";

function pageState(name) {
  if (!pages[name]) pages[name] = { name, view: "now", lastTab: (PAGES[name].tabs[0] || [])[0], lists: {}, open: null, query: "", found: null, sel: 0 };
  return pages[name];
}

const clock = (sec) => { sec = Math.max(0, Math.floor(sec || 0)); return `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, "0")}`; };
const artStyle = (url) => url ? `background-image:url('${String(url).replace(/['\\()]/g, encodeURIComponent)}')` : "";
const post = (path, body) => fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) }).catch(() => {});
const viewList = () => [["now", "Now Playing"], ...PAGES[mpName].tabs];

let mpReady = false;
function setUpMusicPage() {
  if (mpReady) return;
  mpReady = true;
  document.querySelectorAll(".npv [data-op]").forEach((b) => b.addEventListener("click", () => post("/music/control", { op: b.dataset.op })));
  $("mp-repeat").addEventListener("click", () => {
    const r = state && state.music && state.music.repeat;
    post("/music/control", { op: !r ? "repeat_all" : r === "all" ? "repeat_one" : "repeat_off" });
  });
  $("mp-shuffle").addEventListener("click", () => post("/music/control", { op: state && state.music && state.music.shuffle ? "shuffle_off" : "shuffle_on" }));
  $("mp-list").addEventListener("click", (e) => {
    const row = e.target.closest("[data-i], [data-p], [data-back], [data-find]");
    if (row) pickRow(row);
  });
}

// pickView opens a view: its button touched or chosen with the knob. A list's button again goes
// back to its top (the playlists, from an open one).
function pickView(view) {
  const again = mp.view === view;
  if (view === "playlists" && again) mp.open = null;
  setView(view);
  if (view === "search" && (again || !mp.found)) openMusicKeyboard();
  if (again && view !== "search") loadTab(true);
}

function setView(view) {
  if (view !== "now") { mp.lastTab = view; loadTab(false); }
  mp.view = view;
  mp.sel = 0; // the first row
  renderMusic();
  post("/music/view", { view });
}

function pickRow(row) {
  if (row.dataset.find) { openMusicKeyboard(); return; }
  if (row.dataset.back) { mp.open = null; mp.sel = 0; renderMusic(); return; }
  if (row.dataset.p) {
    const p = (mp.lists.playlists || {}).playlists[+row.dataset.p], page = mp;
    page.open = { title: p.title, loading: true };
    page.sel = 0;
    renderMusic();
    browse({ what: "playlist", source: p.source, id: p.id }).then((got) => {
      if (page.open && page.open.title === p.title) { page.open = { ...got, title: p.title }; if (page === mp) renderMusic(); }
    });
    return;
  }
  const list = shownList();
  if (!list || !list.tracks) return;
  fetch("/music/play", { method: "POST", headers: { "Content-Type": "application/json" },
                         body: JSON.stringify({ title: list.title || "", tracks: list.tracks, at: +row.dataset.i }) })
    .then(async (res) => { if (!res.ok) showToast((await res.text()).trim() || "Couldn't play that.", "music"); })
    .catch(() => showToast("Couldn't reach Petasos.", "music"));
  setView("now");
}

// musicNav is the knob, the soft keys and the front button on a music page, from petasos
// (pagecontrols.go): a turn, "press", "key1" to "key4", "back", or "swap" (the page's own soft
// key on the home screen's set, pressed again).
function musicNav(n) {
  if (!mp || $("mpage").hidden) return;
  if (!$("mp-kb").hidden && kb) {
    if (n === "back") closeMusicKeyboard();
    else if (n === "press") kbKnob("press");
    else if (typeof n === "number") kbKnob({ turn: n });
    return;
  }
  const views = viewList();
  if (n === "swap") { if (views.length > 1) setView(mp.view === "now" ? mp.lastTab : "now"); return; }
  if (typeof n === "string" && n.startsWith("key")) { // a soft key: its view
    const v = views[+n.slice(3) - 1];
    if (v && mp.name !== "apple") pickView(v[0]);
    return;
  }
  if (n === "back") { setView("now"); return; } // a list, back to what's playing
  const rows = [...$("mp-list").querySelectorAll("[data-i], [data-p], [data-back], [data-find]")];
  if (n === "press") {
    if (rows[mp.sel]) pickRow(rows[mp.sel]);
    return;
  }
  if (typeof n === "number") {
    mp.sel = Math.max(0, Math.min(rows.length - 1, mp.sel + Math.sign(n)));
    renderMusic();
  }
}

function browse(params) {
  const q = new URLSearchParams(params).toString();
  return fetch("/music/browse?" + q).then((r) => r.json()).catch(() => ({ tracks: [], playlists: [], note: "Can't reach Petasos." }));
}

function loadTab(force) {
  const tab = mp.lastTab, page = mp;
  if (!tab || tab === "search" || (page.lists[tab] && !page.lists[tab].loading && !force)) return;
  if (!page.lists[tab]) page.lists[tab] = { loading: true };
  browse({ what: tab, source: PAGES[page.name].source }).then((got) => { page.lists[tab] = got; if (page === mp) renderMusic(); });
}

function shownList() {
  if (mp.view === "playlists" && mp.open) return mp.open;
  if (mp.view === "search") return mp.found;
  return mp.lists[mp.view];
}

function trackRows(tracks, now) {
  return tracks.map((t, i) => {
    const playing = now && t.title === now.title && (t.artist || "") === (now.artist || "");
    return `<div class="tr${playing ? " now" : ""}" data-i="${i}"><div class="thumb" style="${artStyle(t.art)}">${t.art ? "" : icon("music")}</div>
      <div><b>${esc(t.title)}</b><span>${esc(t.artist)}</span></div><em>${t.seconds ? clock(t.seconds) : ""}</em></div>`;
  }).join("");
}

function listHTML() {
  const now = state && state.music;
  const note = (text) => `<div class="note">${esc(text)}</div>`;
  if (mp.view === "search") {
    let html = `<div class="find" data-find="1">${icon("search")}<div>${esc(mp.query || "Search " + THEMES[mp.name].name)}</div></div>`;
    if (mp.found && mp.found.loading) html += note("Searching…");
    else if (mp.found) html += mp.found.tracks && mp.found.tracks.length ? trackRows(mp.found.tracks, now) : note(mp.found.note || "Nothing found.");
    return html;
  }
  if (mp.view === "playlists" && mp.open) {
    const o = mp.open;
    return `<div class="head" data-back="1">${icon("back")}<div>${esc(o.title)}</div><em>${o.tracks ? o.tracks.length + " songs" : ""}</em></div>` +
      (o.loading ? note("Loading…") : o.tracks && o.tracks.length ? trackRows(o.tracks, now) : note(o.note || "This playlist is empty."));
  }
  const l = mp.lists[mp.view];
  if (!l || l.loading) return note("Loading…");
  if (mp.view === "playlists")
    return (l.playlists || []).length ? l.playlists.map((p, i) => `<div class="pl" data-p="${i}"><div class="thumb" style="${artStyle(p.art)}">${p.art ? "" : icon("list")}</div>
      <div><b>${esc(p.title)}</b><span>${p.count ? p.count + " songs" : ""}</span></div><em></em></div>`).join("")
      : note(l.note || "No playlists yet.");
  return (l.tracks || []).length ? trackRows(l.tracks, now) : note(l.note || "Nothing here yet.");
}

function renderMusic() {
  const listing = mp.view !== "now";
  $("mp-now").hidden = listing;
  $("mp-lib").hidden = !listing;
  const apple = mp.name === "apple";
  $("mp-note").hidden = !apple;
  $("mp-note").textContent = apple ? `Choose music on your iPhone, or ask ${state.agent}` : "";
  if (!listing) return;
  const html = listHTML();
  if (html !== mpShown) { $("mp-list").innerHTML = html; mpShown = html; }
  const rows = $("mp-list").querySelectorAll("[data-i], [data-p], [data-back], [data-find]");
  rows.forEach((r, i) => r.classList.toggle("sel", i === mp.sel));
  const sel = rows[mp.sel];
  if (sel) sel.scrollIntoView({ block: "nearest" });
}

function drawMusicPage(s) {
  setUpMusicPage();
  if (s.page !== mpOpened) { // opened (petasos starts every page on what's playing)
    mpOpened = s.page;
    pageState(s.page).view = "now";
  }
  if (mpName !== s.page) { mpName = s.page; mpShown = ""; }
  mp = pageState(s.page);
  const m = pageMusic(s, s.page);
  const t = THEMES[m && m.service] || THEMES[s.page];
  $("mp-art").style.cssText = m && m.art ? artStyle(m.art) : "";
  $("mp-art").innerHTML = m && m.art ? "" : icon("music");
  $("mp-src").textContent = m ? t.name + (m.service && m.source && !m.library ? " · " + m.source : "") : THEMES[s.page].name;
  $("mp-title").textContent = m ? m.title || "Playing" : "Nothing playing";
  $("mp-artist").textContent = m ? m.artist || "" : s.page === "apple" ? "" : `Pick something, or ask ${s.agent}`;
  $("mp-play").firstElementChild.firstElementChild.setAttribute("href", m && m.playing ? "#i-pause" : "#i-play");
  const lib = !!(m && m.library);
  $("mp-repeat").firstElementChild.firstElementChild.setAttribute("href", m && m.repeat === "one" ? "#i-repeat-one" : "#i-repeat");
  $("mp-repeat").className = !lib ? "off" : m.repeat ? "on" : "";
  $("mp-shuffle").className = !lib ? "off" : m.shuffle ? "on" : "";
  renderMusic();
}

function openMusicKeyboard() {
  $("mp-kb").hidden = false;
  $("mp-kb").innerHTML = `<div class="kb" id="kb"></div>`;
  const page = mp;
  kb = { id: "music-search", text: page.query, max: 60, layout: "abc", shift: !page.query, sel: -1, sent: false, title: "Search",
         onDone: (text) => {
           closeMusicKeyboard();
           page.query = text.trim();
           if (!page.query) { page.found = null; renderMusic(); return; }
           page.found = { loading: true };
           renderMusic();
           const asked = page.query;
           browse({ what: "search", q: asked, source: PAGES[page.name].source }).then((got) => {
             if (page.query === asked) { page.found = got; if (page === mp) renderMusic(); }
           });
         },
         onCancel: () => closeMusicKeyboard() };
  $("kb").addEventListener("pointerdown", (e) => {
    if (e.target.closest("[data-x]")) { e.preventDefault(); kb.onCancel(); return; }
    const el = e.target.closest(".k");
    if (!el) return;
    e.preventDefault();
    el.classList.add("down");
    setTimeout(() => el.classList.remove("down"), 120);
    kb.sel = +el.dataset.i;
    kbType(el.dataset.k);
  });
  renderKeyboard();
}

function closeMusicKeyboard() {
  if ($("mp-kb").hidden) return;
  $("mp-kb").hidden = true;
  $("mp-kb").innerHTML = "";
  if (kb && kb.onDone) kb = null;
}

// --- an update downloading -----------------------------------------------------------------------

function drawUpdate(s) {
  const u = s.update;
  $("update").hidden = !u;
  if (!u) return;
  const part = u.size ? Math.min(1, u.got / u.size) : 0, mb = (n) => (n / 1048576).toFixed(1);
  $("update-ver").textContent = u.version;
  $("update-fill").style.width = `${(100 * part).toFixed(1)}%`;
  $("update-note").textContent = u.installing ? "Installing… Petasos restarts in a moment."
    : u.size ? `${mb(u.got)} of ${mb(u.size)} MB · ${Math.round(100 * part)}%` : "Downloading…";
}

// --- passing notes ---------------------------------------------------------------------------------

let toastTimer = 0;
function showToast(text, iconName) {
  $("toast").innerHTML = icon(iconName) + `<span>${esc(text)}</span>`;
  $("toast").hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { $("toast").hidden = true; }, 1800);
}

// The mic turned off or on (the knob's hold): say so, whichever page is showing.
function drawMicNote(s) {
  if (micNoteSeen === null) { micNoteSeen = s.mic_note || 0; return; }
  if ((s.mic_note || 0) === micNoteSeen) return;
  micNoteSeen = s.mic_note || 0;
  showToast(s.muted ? "Mic off" : "Mic on", s.muted ? "mic-off" : "mic");
}

// --- held: what letting go would do ---------------------------------------------------------------

let holdRun = null;

function drawHold(s) {
  const h = s.hold;
  if (!h || !h.holds || !h.holds.length) { holdRun = null; $("holdpop").hidden = true; return; }
  if (holdRun && holdRun.id === h.id) return;
  const last = h.holds[h.holds.length - 1].ms;
  holdRun = { id: h.id, start: performance.now() - h.since_ms, holds: h.holds, last };
  $("holdpop").innerHTML = `<h4 id="hold-head"></h4>` +
    h.holds.map((step, i) => `<div class="step" id="hold-${i}"><i></i><div>${esc(step.label)}</div><em>${(step.ms / 1000).toFixed(step.ms % 1000 ? 1 : 0)} s</em></div>`).join("") +
    `<div class="track"><div class="fill" id="hold-fill"></div>${h.holds.slice(0, -1).map((step) => `<div class="tick" style="left:${100 * step.ms / last}%"></div>`).join("")}</div>`;
  $("holdpop").hidden = false;
  requestAnimationFrame(stepHold);
}

function stepHold() {
  const run = holdRun;
  if (!run || $("holdpop").hidden) return;
  const held = performance.now() - run.start;
  let on = -1;
  run.holds.forEach((step, i) => { if (held >= step.ms) on = i; });
  $("hold-head").textContent = on < 0 ? "Keep holding to" : "Let go to";
  run.holds.forEach((_, i) => { $("hold-" + i).className = "step" + (i === on ? " on" : i < on ? " past" : ""); });
  $("hold-fill").style.width = `${Math.min(100, 100 * held / run.last)}%`;
  if (held < run.last) requestAnimationFrame(stepHold);
}

// --- the Mac app's microphone ------------------------------------------------------------------

// In the Mac app this page records, as the Hermes desktop app does (pagemic.go): while the
// state has the microphone open it captures it and posts the audio to /mic, one piece at a
// time, until petasos says that recording is over.
let capture = null;

function drawCapture(s) {
  if (!s.page_mic) return;
  if (s.mic_open && (!capture || capture.id !== s.mic_id)) {
    if (capture) capture.stop();
    capture = startCapture(s.mic_id, s.mic_name || "");
  } else if (!s.mic_open && capture) {
    capture.stop();
    capture = null;
  }
}

function startCapture(id, wanted) {
  const run = { id, stopped: false, queue: [], sending: false, rate: 0, cleanup: null };
  run.stop = () => { run.stopped = true; if (run.cleanup) run.cleanup(); };
  const fail = (err) => {
    if (run.stopped) return;
    run.stop();
    const why = `${err && err.name || "Error"}: ${err && err.message || err}`;
    fetch(`/mic?id=${id}&error=${encodeURIComponent(why)}`, { method: "POST" }).catch(() => {});
  };
  (async () => {
    const audio = { echoCancellation: true, noiseSuppression: true, autoGainControl: true };
    if (wanted) {
      const devices = await navigator.mediaDevices.enumerateDevices().catch(() => []);
      const device = devices.find((d) => d.kind === "audioinput" && d.label === wanted);
      if (device) audio.deviceId = { exact: device.deviceId };
    }
    const stream = await navigator.mediaDevices.getUserMedia({ audio });
    if (run.stopped) { stream.getTracks().forEach((t) => t.stop()); return; }
    const ctx = new AudioContext();
    const source = ctx.createMediaStreamSource(stream);
    const tap = ctx.createScriptProcessor(2048, 1, 1);
    const hush = ctx.createGain();
    hush.gain.value = 0; // the tap only runs while connected to the speakers, so connect it silently
    source.connect(tap); tap.connect(hush); hush.connect(ctx.destination);
    run.rate = ctx.sampleRate;
    run.cleanup = () => {
      tap.onaudioprocess = null;
      source.disconnect(); tap.disconnect(); hush.disconnect();
      stream.getTracks().forEach((t) => t.stop());
      ctx.close().catch(() => {});
    };
    tap.onaudioprocess = (e) => {
      if (run.stopped) return;
      const f = e.inputBuffer.getChannelData(0);
      const pcm = new Int16Array(f.length);
      for (let i = 0; i < f.length; i++) pcm[i] = Math.max(-1, Math.min(1, f[i])) * 32767;
      run.queue.push(pcm);
      sendCapture(run);
    };
    if (ctx.state === "suspended") await ctx.resume();
  })().catch(fail);
  return run;
}

async function sendCapture(run) {
  if (run.sending) return;
  run.sending = true;
  while (run.queue.length && !run.stopped) {
    const parts = run.queue.splice(0);
    const joined = new Int16Array(parts.reduce((n, p) => n + p.length, 0));
    let at = 0;
    for (const p of parts) { joined.set(p, at); at += p.length; }
    try {
      const res = await fetch(`/mic?id=${run.id}&rate=${run.rate}`, { method: "POST", body: joined.buffer });
      if (res.status === 410) run.stop(); // that recording is over
    } catch (_) {}
  }
  run.sending = false;
}

// The kiosk keeps this page open across petasos updates; when the program behind it is a newer
// one, load the newer page.
let pageVersion = null;

function connect() {
  const events = new EventSource("/events");
  events.onmessage = (e) => {
    const message = JSON.parse(e.data);
    if ("kb" in message) { kbKnob(message.kb); return; }
    if ("mic" in message) { // the microphone's level, many times a second while listening
      if (state && state.phase === "listening") { micTarget = message.mic; moveBands(); }
      return;
    }
    if ("lvl" in message) { lvlTarget = message.lvl; moveBands(); return; } // the sound's level (audiometer.go)
    if ("nav" in message) { musicNav(message.nav); return; } // the knob or front button on a music page
    state = message;
    if (pageVersion === null) pageVersion = state.version;
    else if (state.version !== pageVersion) { location.replace("/?v=" + encodeURIComponent(state.version)); return; }
    draw(state);
  };
  events.onerror = () => { $("hint").textContent = "Starting…"; $("hint").className = "hint wait"; };
}
// --- the virtual Petasos's controls ------------------------------------------------------------

// press sends one control's press or release to petasos, which treats it like the real button.
function press(input, action, delta) {
  fetch("/input", { method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ input, action, delta }) }).catch(() => {});
}

let controlsReady = false;
function setUpControls(s) {
  $("c-pin").hidden = !!s.no_pin;
  $("c-pin").classList.toggle("on", !!s.on_top);
  $("c-pin").title = s.on_top ? "Stop keeping this window on top" : "Keep this window on top";
  if (controlsReady) return;
  controlsReady = true;
  document.body.classList.add("virtual");
  $("controls").hidden = false;
  // The Mac's own speakers need no watching; in the phone's place, whether the Mac is online.
  $("l-speaker").style.display = "none";
  $("l-phone").firstElementChild.setAttribute("href", "#i-network");
  const held = new Set();
  const down = (input, el) => { if (held.has(input)) return; held.add(input); el && el.classList.add("down"); press(input, "press"); };
  const up = (input, el) => { if (!held.delete(input)) return; el && el.classList.remove("down"); press(input, "release"); };
  const hold = (el, input) => {
    el.addEventListener("pointerdown", (e) => { el.setPointerCapture(e.pointerId); down(input, el); });
    el.addEventListener("pointerup", () => up(input, el));
    el.addEventListener("pointercancel", () => up(input, el));
  };
  hold($("c-front"), "front");
  hold($("c-mute"), "mute");
  hold($("c-knob"), "knob");
  [0, 1, 2, 3].forEach((i) => hold($("p" + i), "preset-" + (i + 1)));
  $("c-up").addEventListener("click", () => press("knob", "turn", 1));
  $("c-settings").addEventListener("click", () => { location.href = "settings.html"; });
  $("c-pin").addEventListener("click", () => {
    fetch("/app/window", { method: "POST", headers: { "Content-Type": "application/json" },
                           body: JSON.stringify({ on_top: !(state && state.on_top) }) }).catch(() => {});
  });
  $("c-down").addEventListener("click", () => press("knob", "turn", -1));
  if (window.petasosWindow) { // the apps' windows have no title bar of their own
    $("c-min").hidden = $("c-close").hidden = false;
    $("c-min").addEventListener("click", () => petasosWindow("minimize"));
    $("c-close").addEventListener("click", () => petasosWindow("close"));
  }
  const keys = { " ": ["front", "c-front"], m: ["mute", "c-mute"], M: ["mute", "c-mute"], Enter: ["knob", "c-knob"],
                 1: ["preset-1", "p0"], 2: ["preset-2", "p1"], 3: ["preset-3", "p2"], 4: ["preset-4", "p3"] };
  addEventListener("keydown", (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === "ArrowUp" || e.key === "ArrowRight") { press("knob", "turn", 1); e.preventDefault(); return; }
    if (e.key === "ArrowDown" || e.key === "ArrowLeft") { press("knob", "turn", -1); e.preventDefault(); return; }
    const k = keys[e.key];
    if (k) { e.preventDefault(); if (!e.repeat) down(k[0], $(k[1])); }
  });
  addEventListener("keyup", (e) => { const k = keys[e.key]; if (k) { e.preventDefault(); up(k[0], $(k[1])); } });
  addEventListener("blur", () => { for (const [, [input, id]] of Object.entries(keys)) up(input, $(id)); });
  let wheel = 0;
  addEventListener("wheel", (e) => {
    if (e.target.closest(".lib .list")) return; // scrolling the music page's list, not the volume
    wheel += e.deltaY;
    while (Math.abs(wheel) >= 60) { press("knob", "turn", wheel < 0 ? 1 : -1); wheel -= Math.sign(wheel) * 60; }
  }, { passive: true });
}

// In the apps, which have no title bar, the window moves by dragging the page's background.
if (window.petasosWindow) addEventListener("mousedown", (e) => {
  if (e.button === 0 && !e.target.closest("button, .topbar > span, a, input, select, textarea, label, .k, .row, .page, .mp-kb"))
    petasosWindow("drag");
});

document.fonts.ready.then(connect);
</script>
